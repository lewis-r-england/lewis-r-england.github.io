<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative">
  <sc-if value="{{ isGridVal }}" hint-placeholder-val="{{ true }}">
    <button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:8px;width:calc(100% - 6px);margin:3px;padding:6px 8px 6px 9px;border:1px solid #dfe8e2;border-radius:6px;background:#fff;font-family:inherit;font-size:12.5px;color:#1c2620;text-align:left;white-space:nowrap;cursor:pointer" style-hover="border-color:#9ecab0"><span style="flex:1 1 auto">{{ text }}</span><span style="color:#9caaa3;font-size:9px">▼</span></button>
  </sc-if>
  <sc-if value="{{ isGridEmpty }}">
    <button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:8px;width:calc(100% - 6px);margin:3px;padding:6px 8px 6px 9px;border:1px solid #dfe8e2;border-radius:6px;background:#fff;font-family:inherit;font-size:12.5px;color:#4e8a67;text-align:left;white-space:nowrap;cursor:pointer" style-hover="border-color:#9ecab0"><span style="flex:1 1 auto">{{ placeholderText }}</span><span style="color:#9caaa3;font-size:9px">▼</span></button>
  </sc-if>
  <sc-if value="{{ isGridBad }}">
    <button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:8px;width:calc(100% - 6px);margin:3px;padding:5px 8px 5px 9px;border:1px solid #e0a79a;border-radius:6px;background:#fdf1ee;font-family:inherit;font-size:12.5px;font-weight:600;color:#8f2f1e;text-align:left;white-space:nowrap;cursor:pointer"><span style="flex:1 1 auto">{{ badText }}</span><span style="font-size:9px">▼</span></button>
  </sc-if>
  <sc-if value="{{ isFieldVal }}">
    <button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;border:1px solid #d7ded9;border-radius:8px;background:#fff;font-family:inherit;font-size:13px;color:#1c2620;text-align:left;cursor:pointer"><span style="flex:1 1 auto">{{ text }}</span><span style="color:#b6c2bb;font-size:9px">▼</span></button>
  </sc-if>
  <sc-if value="{{ isFieldEmpty }}">
    <button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;border:1px solid #d7ded9;border-radius:8px;background:#fff;font-family:inherit;font-size:13px;color:#4e8a67;text-align:left;cursor:pointer"><span style="flex:1 1 auto">{{ placeholderText }}</span><span style="color:#cfd8d2;font-size:9px">▼</span></button>
  </sc-if>
  <sc-if value="{{ isFieldBad }}">
    <button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;border:1px solid #e0a79a;border-radius:8px;background:#fdf1ee;font-family:inherit;font-size:13px;font-weight:600;color:#8f2f1e;text-align:left;cursor:pointer"><span style="flex:1 1 auto">{{ badText }}</span><span style="font-size:9px">▼</span></button>
  </sc-if>

  <sc-if value="{{ showMsg }}">
    <div style="position:absolute;top:calc(100% + 4px);left:3px;z-index:6;padding:5px 9px;border-radius:6px;background:#8f2f1e;color:#fff;font-size:11px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18)">{{ msg }}</div>
  </sc-if>

  <sc-if value="{{ open }}">
    <div style="position:absolute;top:calc(100% + 4px);left:0;z-index:40;width:266px;background:#fff;border:1px solid #d7ded9;border-radius:10px;box-shadow:0 14px 34px rgba(20,40,28,.2);overflow:hidden">
      <div style="display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid #eef1ee;background:#fbfcfb">
        <span style="color:#9aa8a1;font-size:11px">⌕</span>
        <input value="{{ query }}" onChange="{{ onQueryInput }}" placeholder="{{ searchHint }}" autoFocus="{{ true }}" style="flex:1 1 auto;min-width:0;border:none;background:transparent;font-family:inherit;font-size:12.5px;color:#1c2620;outline:none">
      </div>
      <div style="max-height:212px;overflow:auto">
        <sc-for list="{{ results }}" as="o" hint-placeholder-count="4">
          <button onClick="{{ o.pick }}" style="display:flex;align-items:baseline;gap:9px;width:100%;padding:8px 11px;border:none;border-bottom:1px solid #f3f5f3;background:#fff;font-family:inherit;font-size:12.5px;text-align:left;cursor:pointer" style-hover="background:#f2f7f3">
            <sc-if value="{{ o.hasCode }}" hint-placeholder-val="{{ true }}"><span style="font-family:'IBM Plex Mono',monospace;font-weight:600;color:#14532d">{{ o.code }}</span></sc-if>
            <span style="flex:1 1 auto;color:#1c2620">{{ o.name }}</span>
            <sc-if value="{{ o.hasMeta }}"><span style="font-size:10.5px;color:#9aa8a1;white-space:nowrap">{{ o.meta }}</span></sc-if>
          </button>
        </sc-for>
        <sc-if value="{{ noResults }}">
          <div style="padding:14px 12px;font-size:12px;color:#9aa8a1">No match for “{{ query }}”</div>
        </sc-if>
      </div>
      <sc-if value="{{ hasFooter }}"><div style="padding:6px 11px;font-size:10.5px;color:#9aa8a1;background:#fbfcfb;border-top:1px solid #eef1ee">{{ footer }}</div></sc-if>
    </div>
    <div onClick="{{ toggle }}" style="position:fixed;inset:0;z-index:30"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:120},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;F1100 – LSGH&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Select&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grid&quot;,&quot;field&quot;],&quot;default&quot;:&quot;field&quot;,&quot;tsType&quot;:&quot;'grid'|'field'&quot;},&quot;bad&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;msg&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;footer&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;searchHint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Search code or name&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;query&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{code?:string,name:string,meta?:string}[]&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(o:any)=&gt;void&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onQuery&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const variant = p.variant || 'grid';
    const val = p.value == null ? '' : String(p.value);
    const has = val !== '' && val !== '—';
    const bad = !!p.bad;
    const q = (p.query || '').toLowerCase().trim();
    const list = Array.isArray(p.options) ? p.options : [];
    const results = list
      .filter(o => !q || ((o.code || '') + ' ' + (o.name || '')).toLowerCase().indexOf(q) > -1)
      .map(o => ({
        code: o.code || '', name: o.name || '', meta: o.meta || '',
        hasCode: !!o.code, hasMeta: !!o.meta,
        pick: () => { if (p.onPick) p.onPick(o); }
      }));
    return {
      text: val, badText: has ? val : (p.placeholder || 'Select'),
      placeholderText: p.placeholder || 'Select',
      isGridVal: variant === 'grid' && has && !bad,
      isGridEmpty: variant === 'grid' && !has && !bad,
      isGridBad: variant === 'grid' && bad,
      isFieldVal: variant === 'field' && has && !bad,
      isFieldEmpty: variant === 'field' && !has && !bad,
      isFieldBad: variant === 'field' && bad,
      showMsg: bad && !!p.msg && !p.open,
      msg: p.msg || '',
      open: !!p.open, query: p.query || '',
      searchHint: p.searchHint || 'Search code or name',
      onQueryInput: e => { if (p.onQuery) p.onQuery(e.target.value); },
      toggle: () => { if (p.onToggle) p.onToggle(); },
      results, noResults: results.length === 0,
      hasFooter: !!p.footer, footer: p.footer || ''
    };
  }
}
</script>
</body>
</html>
