<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative">
  <sc-if value="{{ isGrid }}" hint-placeholder-val="{{ true }}">
    <button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:7px;width:calc(100% - 6px);margin:3px;padding:6px 8px;border:1px solid #dfe8e2;border-radius:6px;background:#fff;font-family:inherit;font-size:12.5px;color:#1c2620;text-align:left;white-space:nowrap;cursor:pointer" style-hover="border-color:#9ecab0"><span style="flex:1 1 auto">{{ text }}</span><span style="color:#9caaa3;font-size:11px">▤</span></button>
  </sc-if>
  <sc-if value="{{ isGridBad }}">
    <button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:7px;width:calc(100% - 6px);margin:3px;padding:6px 8px;border:1px solid #e0a79a;border-radius:6px;background:#fdf1ee;font-family:inherit;font-size:12.5px;font-weight:600;color:#8f2f1e;text-align:left;white-space:nowrap;cursor:pointer"><span style="flex:1 1 auto">{{ text }}</span><span style="font-size:11px">▤</span></button>
  </sc-if>
  <sc-if value="{{ isField }}">
    <button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;border:1px solid #d7ded9;border-radius:8px;background:#fff;font-family:inherit;font-size:13px;color:#1c2620;text-align:left;cursor:pointer" style-hover="border-color:#9ecab0"><span style="flex:1 1 auto">{{ text }}</span><span style="color:#9caaa3;font-size:12px">▤</span></button>
  </sc-if>
  <sc-if value="{{ isFieldBad }}">
    <button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;border:1px solid #e0a79a;border-radius:8px;background:#fdf1ee;font-family:inherit;font-size:13px;font-weight:600;color:#8f2f1e;text-align:left;cursor:pointer"><span style="flex:1 1 auto">{{ text }}</span><span style="font-size:12px">▤</span></button>
  </sc-if>

  <sc-if value="{{ open }}">
    <div style="position:absolute;top:calc(100% + 4px);left:0;z-index:40;width:252px;background:#fff;border:1px solid #d7ded9;border-radius:10px;box-shadow:0 14px 34px rgba(20,40,28,.2);overflow:hidden">
      <div style="display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #eef1ee;background:#fbfcfb">
        <button onClick="{{ prev }}" style="width:24px;height:24px;border:1px solid #e4e8e4;border-radius:6px;background:#fff;color:#3c473f;font-size:11px;cursor:pointer" style-hover="border-color:#14532d">‹</button>
        <span style="flex:1 1 auto;text-align:center;font-size:12.5px;font-weight:600">{{ monthLabel }}</span>
        <button onClick="{{ next }}" style="width:24px;height:24px;border:1px solid #e4e8e4;border-radius:6px;background:#fff;color:#3c473f;font-size:11px;cursor:pointer" style-hover="border-color:#14532d">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px 10px 3px">
        <sc-for list="{{ dows }}" as="d" hint-placeholder-count="7">
          <span style="text-align:center;font-size:9.5px;font-weight:600;letter-spacing:.04em;color:#9caaa3">{{ d.l }}</span>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 10px 8px">
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="35">
          <sc-if value="{{ d.blank }}"><span></span></sc-if>
          <sc-if value="{{ d.sel }}"><button onClick="{{ d.pick }}" style="height:28px;border:none;border-radius:6px;background:#14532d;color:#fff;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer">{{ d.n }}</button></sc-if>
          <sc-if value="{{ d.today }}"><button onClick="{{ d.pick }}" style="height:28px;border:1px solid #14532d;border-radius:6px;background:#eaf3ed;color:#14532d;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer">{{ d.n }}</button></sc-if>
          <sc-if value="{{ d.plain }}" hint-placeholder-val="{{ true }}"><button onClick="{{ d.pick }}" style="height:28px;border:none;border-radius:6px;background:#fff;color:#1c2620;font-family:inherit;font-size:12px;cursor:pointer" style-hover="background:#f2f7f3">{{ d.n }}</button></sc-if>
          <sc-if value="{{ d.weekend }}"><button onClick="{{ d.pick }}" style="height:28px;border:none;border-radius:6px;background:#fbfcfb;color:#9caaa3;font-family:inherit;font-size:12px;cursor:pointer" style-hover="background:#f2f7f3">{{ d.n }}</button></sc-if>
        </sc-for>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid #eef1ee;background:#fbfcfb">
        <span style="flex:1 1 auto;font-size:10.5px;color:#9aa8a1">{{ weekNote }}</span>
        <button onClick="{{ pickToday }}" style="font-family:inherit;font-size:11.5px;font-weight:600;padding:4px 10px;border:1px solid #e4e8e4;border-radius:6px;background:#fff;color:#14532d;cursor:pointer">Today</button>
      </div>
    </div>
    <div onClick="{{ toggle }}" style="position:fixed;inset:0;z-index:30"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:150},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;27/08/2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;dd/mm/yyyy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grid&quot;,&quot;field&quot;],&quot;default&quot;:&quot;field&quot;,&quot;tsType&quot;:&quot;'grid'|'field'&quot;},&quot;bad&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:string)=&gt;void&quot;},&quot;onToggle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const TODAY = { d: 27, m: 8, y: 2026 };
const pad = n => String(n).padStart(2, '0');
const fmt = (d, m, y) => pad(d) + '/' + pad(m) + '/' + y;
const parse = s => {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec((s || '').trim());
  return m ? { d: +m[1], m: +m[2], y: +m[3] } : null;
};
const isoWeek = (d, m, y) => {
  const dt = new Date(Date.UTC(y, m - 1, d));
  const day = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - day);
  const start = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
  return Math.ceil(((dt - start) / 86400000 + 1) / 7);
};

class Component extends DCLogic {
  state = { off: 0 };

  renderVals() {
    const p = this.props;
    const variant = p.variant || 'grid';
    const val = (p.value == null ? '' : String(p.value)).trim();
    const cur = parse(val);
    const base = cur || TODAY;
    let mi = base.m - 1 + (this.state.off || 0);
    let y = base.y + Math.floor(mi / 12);
    const m = ((mi % 12) + 12) % 12;
    const first = new Date(Date.UTC(y, m, 1)).getUTCDay() || 7;
    const len = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    const days = [];
    for (let i = 1; i < first; i++) days.push({ blank: true, n: '' });
    for (let n = 1; n <= len; n++) {
      const dow = new Date(Date.UTC(y, m, n)).getUTCDay();
      const sel = !!cur && cur.d === n && cur.m === m + 1 && cur.y === y;
      const today = !sel && TODAY.d === n && TODAY.m === m + 1 && TODAY.y === y;
      const weekend = !sel && !today && (dow === 0 || dow === 6);
      days.push({
        n: String(n), blank: false, sel, today, weekend, plain: !sel && !today && !weekend,
        pick: () => { this.setState({ off: 0 }); if (p.onPick) p.onPick(fmt(n, m + 1, y)); }
      });
    }
    const wk = cur ? isoWeek(cur.d, cur.m, cur.y) : isoWeek(TODAY.d, TODAY.m, TODAY.y);
    return {
      isGrid: variant === 'grid' && !p.bad, isGridBad: variant === 'grid' && !!p.bad,
      isField: variant === 'field' && !p.bad, isFieldBad: variant === 'field' && !!p.bad,
      text: val || (p.placeholder || 'dd/mm/yyyy'),
      open: !!p.open,
      toggle: () => { this.setState({ off: 0 }); if (p.onToggle) p.onToggle(); },
      monthLabel: MONTHS[m] + ' ' + y,
      dows: ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(l => ({ l })),
      days,
      prev: () => this.setState({ off: (this.state.off || 0) - 1 }),
      next: () => this.setState({ off: (this.state.off || 0) + 1 }),
      weekNote: 'Week ' + wk + ' · auto-generated from the date',
      pickToday: () => { this.setState({ off: 0 }); if (p.onPick) p.onPick(fmt(TODAY.d, TODAY.m, TODAY.y)); }
    };
  }
}
</script>
</body>
</html>
